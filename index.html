<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bible">
<meta name="theme-color" content="#FDFDFB">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>The Holy Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDFDFB;
    --ink: #1C1B1A;
    --rubric: #8C2F2F;      /* the red of rubricated manuscripts */
    --rule: #DAD7D2;
    --muted: #7A756E;
    --hover: #F3F1EC;
    --serif: "EB Garamond", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--serif); min-height: 100vh; }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding: 1.1rem 1.5rem 0.9rem; border-bottom: 1px solid var(--rule);
  }
  header h1 { font-weight: 500; font-size: 1.25rem; letter-spacing: 0.16em; text-transform: uppercase; }
  header h1 span { color: var(--rubric); }
  .header-right { display: flex; align-items: center; gap: 0.75rem; }
  .gear-btn {
    font-family: var(--sans); font-size: 1rem; line-height: 1;
    background: none; border: 1px solid var(--rule); border-radius: 6px;
    padding: 0.35rem 0.5rem; color: var(--muted); cursor: pointer;
  }
  .gear-btn:hover { background: var(--hover); color: var(--ink); }
  .settings-menu-head {
    font-family: var(--sans); font-size: 0.64rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--rubric);
    padding: 0.35rem 0.7rem 0.4rem;
  }
  .trans-wrap {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  select {
    font-family: var(--sans); font-size: 0.8rem; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    padding: 0.35rem 0.5rem; cursor: pointer; max-width: 15rem;
  }
  select:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }

  .view { display: none; }
  .view.show { display: block; }

  /* ---------- Page 1: Books ---------- */
  #booksView { padding: 2rem clamp(1.25rem, 5vw, 4rem) 4rem; max-width: 62rem; margin: 0 auto; }
  .testament-label {
    font-family: var(--sans); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--rubric); margin: 2rem 0 0.8rem;
    display: flex; align-items: center; gap: 0.9rem;
  }
  .testament-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .testament-label:first-child { margin-top: 0; }
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .book-grid button {
    font-family: var(--sans); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.06em;
    padding: 0.7rem 0; background: none; border: 1px solid var(--rule); border-radius: 5px;
    color: var(--ink); cursor: pointer;
  }
  .book-grid button:hover { background: var(--hover); }
  .book-grid button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .book-grid button:disabled { color: var(--rule); border-color: var(--hover); cursor: default; background: none; }

  /* ---------- Page 2: Reading ---------- */
  #readView { padding: 1.4rem clamp(1.25rem, 5vw, 4rem) 4rem; max-width: 46rem; margin: 0 auto; }
  .read-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .read-tools { margin-left: auto; display: flex; gap: 4px; }
  .settings-wrap { position: relative; }
  .settings-menu {
    position: absolute; right: 0; top: calc(100% + 4px);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(28,27,26,0.18); padding: 0.3rem; z-index: 30; min-width: 12.5rem;
  }
  .settings-menu[hidden] { display: none; }
  .settings-item {
    display: block; width: 100%; text-align: left;
    font-family: var(--sans); font-size: 0.82rem; color: var(--ink);
    background: none; border: none; border-radius: 5px; padding: 0.55rem 0.7rem; cursor: pointer;
  }
  .settings-item:hover { background: var(--hover); }
  .settings-item:active { background: var(--hover); color: var(--rubric); }
  .back-btn {
    font-family: var(--sans); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.06em;
    background: none; border: 1px solid var(--rule); border-radius: 4px;
    padding: 0.45rem 0.8rem; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .back-btn:hover { background: var(--hover); }
  .back-btn:disabled { color: var(--rule); cursor: default; background: none; }
  .back-btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .read-top .bookname { font-size: 1.3rem; font-weight: 500; letter-spacing: 0.05em; }

  .chapter-strip {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding-bottom: 1.1rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.6rem;
  }
  .chapter-strip button {
    font-family: var(--sans); font-size: 0.74rem; min-width: 36px; padding: 0.45rem 0.3rem;
    background: none; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--ink); cursor: pointer;
  }
  .chapter-strip button:hover { background: var(--hover); }
  .chapter-strip button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .chapter-strip button.active { background: var(--rubric); border-color: var(--rubric); color: var(--paper); }

  .welcome { color: var(--muted); font-size: 1.05rem; font-style: italic; margin-top: 1rem; }

  .passage-head { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.7rem; }
  .passage-head .chapnum { font-size: 3.2rem; line-height: 1; color: var(--rubric); }
  .passage-head .transname {
    font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .passage-title { display: flex; flex-direction: column; gap: 0.15rem; }
  .passage-title .bookref { font-family: var(--serif); font-size: 1.35rem; font-weight: 500; color: var(--ink); line-height: 1.1; }
  .chapter-controls {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding-bottom: 1.1rem; margin-bottom: 1.4rem; border-bottom: 1px solid var(--rule);
  }
  .chapter-controls .summary-btn { margin-right: auto; }
  @media (max-width: 560px) {
    .chapter-controls .summary-btn { flex-basis: 100%; margin-right: 0; }
    .chapter-controls #readChapterBtn, .chapter-controls #readContinuousBtn { flex: 1; text-align: center; }
  }

  .scripture { font-size: var(--fs, 1.16rem); line-height: 1.75; }
  .scripture sup,
  .scripture .v {
    font-family: var(--sans); font-size: 0.62em; font-weight: 500; color: var(--rubric);
    margin-right: 0.25em; vertical-align: super; line-height: 0;
  }
  .scripture p { margin-bottom: 0.6rem; }
  /* API.Bible section headings and poetry classes */
  .scripture h3, .scripture .s, .scripture .s1, .scripture .s2 {
    font-family: var(--sans); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin: 1.4rem 0 0.5rem;
  }
  .scripture .q, .scripture .q1 { margin-left: 1.2rem; }
  .scripture .q2 { margin-left: 2.4rem; }
  .scripture .d { font-style: italic; color: var(--muted); }

  .pager {
    display: flex; justify-content: space-between; margin-top: 2.2rem;
    padding-top: 1.1rem; border-top: 1px solid var(--rule);
  }
  .pager button {
    font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.06em;
    background: none; border: 1px solid var(--rule); border-radius: 4px;
    padding: 0.5rem 0.9rem; color: var(--ink); cursor: pointer;
  }
  .pager button:hover { background: var(--hover); }
  .pager button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .pager button[hidden] { visibility: hidden; }

  .status { color: var(--muted); font-style: italic; margin-top: 1.5rem; }
  .status.error { color: var(--rubric); font-style: normal; font-family: var(--sans); font-size: 0.85rem; }

  /* ---------- Verse selection & exegesis ---------- */
  .verse { cursor: pointer; border-radius: 3px; }
  .verse:hover { background: var(--hover); }
  .verse.sel { background: #F5E6E6; box-shadow: 0 0 0 3px #F5E6E6; }
  .sel-bar[hidden] { display: none; }
  .sel-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    box-shadow: 0 4px 18px rgba(28,27,26,0.25);
    z-index: 20;
    max-width: min(92vw, 40rem);
  }
  .sel-bar .sel-ref {
    font-family: var(--sans);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .sel-bar button {
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    background: none;
    border: 1px solid rgba(253,253,251,0.35);
    border-radius: 5px;
    padding: 0.4rem 0.8rem;
    color: var(--paper);
    cursor: pointer;
    white-space: nowrap;
  }
  .sel-bar button:hover { background: rgba(253,253,251,0.12); }
  .lens-btn {
    display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 0.3rem 0.6rem !important; line-height: 1.05;
  }
  .lens-ltr { font-family: var(--serif); font-size: 1.05rem; font-weight: 500; }
  .lens-cap { font-size: 0.5rem; letter-spacing: 0.02em; color: rgba(253,253,251,0.65); text-transform: none; }
  .lens-close { justify-content: center; font-size: 0.95rem; }
  .lens-close .lens-cap { display: none; }
  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px));
    background: var(--rubric);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 0.8rem;
    border-radius: 6px;
    padding: 0.55rem 0.9rem;
    z-index: 21;
    box-shadow: 0 4px 14px rgba(140,47,47,0.3);
  }

  /* ---------- Exegesis panel ---------- */
  .exegesis-panel {
    margin-top: 2rem;
    border-left: 3px solid var(--rubric);
    background: #F8F5F0;
    padding: 1.1rem 1.4rem 1.3rem;
    border-radius: 0 6px 6px 0;
  }
  .exegesis-panel .ex-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rubric);
    margin-bottom: 0.8rem;
  }
  .exegesis-panel .ex-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
  }
  .exegesis-panel .ex-close:hover { color: var(--ink); }
  .ex-body { font-size: calc(var(--fs, 1.16rem) * 0.9); line-height: 1.7; }
  .ex-body p { margin-bottom: 0.7rem; }
  .ex-body h3, .ex-body h4 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.02em;
    margin: 1.1rem 0 0.4rem;
  }
  .ex-body ul, .ex-body ol { margin: 0.3rem 0 0.8rem 1.4rem; }
  .ex-body li { margin-bottom: 0.25rem; }
  .ex-body .ex-status { color: var(--muted); font-style: italic; }
  .ex-tools { display: flex; align-items: center; gap: 0.4rem; }
  .ex-head .sec-copy.head-copy { display: inline-block; }
  .ex-body summary { display: flex; align-items: center; }
  .ex-body summary .sec-title { flex: 1; }
  .sec-copy {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    color: var(--muted);
    cursor: pointer;
    display: none;
  }
  .ex-body details[open] > summary .sec-copy { display: inline-block; }
  .sec-copy:hover { background: var(--hover); color: var(--ink); }
  .sec-copy:active { background: var(--hover); color: var(--rubric); }
  .summary-btn { align-self: center; }
  .ex-body details {
    border-top: 1px solid var(--rule);
    padding: 0.15rem 0;
  }
  .ex-body details:last-of-type { border-bottom: 1px solid var(--rule); }
  .ex-body summary {
    font-family: var(--sans);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding: 0.55rem 0.2rem;
    list-style: none;
  }
  .ex-body summary::-webkit-details-marker { display: none; }
  .ex-body summary::before {
    content: "+";
    color: var(--rubric);
    display: inline-block;
    width: 1.1rem;
    font-weight: 500;
  }
  .ex-body details[open] > summary::before { content: "\2212"; }
  .ex-body details > *:not(summary) { padding: 0.1rem 0.2rem 0.6rem 1.1rem; }
  .ex-lead { margin-bottom: 0.9rem; }
  .ex-lead p { margin-bottom: 0.4rem; }

  @media (prefers-reduced-motion: no-preference) {
    .scripture { animation: fadein 0.25s ease; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  }

  /* ---------- Touch feedback (iPad has no hover) ---------- */
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .back-btn:active,
  .book-grid button:not(:disabled):active,
  .chapter-strip button:active,
  .pager button:active {
    background: var(--hover);
    transform: scale(0.97);
  }
  .book-grid button:not(:disabled):active { border-color: var(--rubric); }
  .chapter-strip button.active:active { background: var(--rubric); }
  .sel-bar button:active { background: rgba(253,253,251,0.22); transform: scale(0.97); }
  .sel-bar #exegesisBtn:active,
  .sel-bar #reflectBtn:active,
  .sel-bar #verseAskBtn:active,
  .sel-bar #councilBtn:active,
  .sel-bar #youthBtn:active { background: var(--rubric); border-color: var(--rubric); }

  /* Narrow phones: reference on its own line, buttons beneath, everything on screen */
  @media (max-width: 480px) {
    .sel-bar {
      flex-wrap: wrap;
      justify-content: center;
      row-gap: 0.45rem;
      padding: 0.55rem 0.8rem;
      max-width: 94vw;
    }
    .sel-bar .sel-ref {
      flex-basis: 100%;
      text-align: center;
      font-size: 0.76rem;
    }
    .sel-bar button { font-size: 0.74rem; padding: 0.35rem 0.65rem; }
  }
  .ex-close:active { color: var(--rubric); }

  /* ---------- Daily Devotional ---------- */
  .daily-btn {
    display: block;
    width: 100%;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    background: none;
    border: 1px solid var(--rubric);
    border-radius: 6px;
    padding: 0.7rem;
    margin-bottom: 1.6rem;
    color: var(--rubric);
    cursor: pointer;
  }
  .daily-btn:hover { background: var(--hover); }
  .daily-btn:active { background: #F5E6E6; transform: scale(0.99); }
  #askReader { max-width: 44rem; }
  .daily-ask {
    background: #F8F5F0;
    border-left: 3px solid var(--rubric);
    border-radius: 0 6px 6px 0;
    padding: 18px 20px;
  }
  .daily-ask .ask-head {
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rubric);
    margin-bottom: 12px;
  }
  .daily-ask .ask-q { font-size: 1.15rem; margin: 0 0 4px; }
  .daily-ask .ask-sub { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); margin: 0 0 14px; }
  .daily-ask .ask-row { display: flex; gap: 8px; align-items: stretch; }
  .daily-ask textarea {
    flex: 1;
    font-family: var(--sans);
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 9px 12px;
    resize: none;
    min-height: 42px;
    line-height: 1.4;
  }
  .daily-ask textarea:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .daily-ask .ask-begin {
    font-family: var(--sans);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    background: var(--rubric);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  .daily-ask .ask-begin:active { background: #762727; }
  @media (max-width: 480px) {
    .daily-ask .ask-row { flex-direction: column; }
    .daily-ask .ask-begin { padding: 10px; }
  }
  .ask-recent { margin-top: 14px; }
  .ask-recent-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: var(--sans); font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  .ask-recent-clear {
    font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.04em;
    background: none; border: none; color: var(--muted); cursor: pointer;
    text-transform: none; padding: 2px 4px;
  }
  .ask-recent-clear:hover { color: var(--rubric); }
  .ask-recent-item {
    display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left;
    font-family: var(--serif); font-size: 0.92rem; color: var(--ink);
    background: none; border: none; border-top: 1px solid var(--rule);
    padding: 0.55rem 0.2rem; cursor: pointer;
  }
  .ask-recent-item:last-child { border-bottom: 1px solid var(--rule); }
  .ask-recent-item:hover { color: var(--rubric); }
  .ask-recent-item .ari-icon { color: var(--muted); font-size: 0.85em; flex: none; }
  .ask-recent-item .ari-text { flex: 1; }
  .ask-recent-del {
    flex: none; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.95rem; line-height: 1;
    padding: 0.2rem 0.4rem; border-radius: 4px;
  }
  .ask-recent-del:hover { color: var(--rubric); background: var(--hover); }
  .ask-recent-more {
    display: block; width: 100%; text-align: center;
    font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.05em;
    background: none; border: none; color: var(--rubric); cursor: pointer;
    padding: 0.6rem 0.2rem;
  }
  .ask-recent-more:hover { text-decoration: underline; }
  .ask-context {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: var(--sans); font-size: 0.8rem; color: var(--ink);
    background: #F5E6E6; border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.7rem;
  }
  .ask-context strong { font-weight: 600; }
  .verse-ask-card { background: none; border-left: none; border-radius: 0; padding: 0; }
  .verse-ask-card .ask-q { font-size: 1.15rem; margin: 0 0 0.15rem; }

  /* ---------- Council of Voices & Youth ---------- */
  .council-intro { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); margin: 0 0 0.9rem; line-height: 1.5; }
  .council-tier {
    font-family: var(--sans); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--rubric); margin: 1rem 0 0.1rem;
  }
  .council-tier .cv-count { color: var(--muted); font-weight: 400; }
  .council-list { display: flex; flex-direction: column; }
  .council-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-top: 1px solid var(--rule); padding: 0.55rem 0.2rem; cursor: pointer; font-family: var(--serif);
  }
  .council-list .council-item:first-child { border-top: none; }
  .council-item:hover .cv-name { color: var(--rubric); }
  .council-auto { border: none; }
  .council-auto .cv-name { color: var(--rubric); }
  .cv-name { font-size: 1rem; color: var(--ink); }
  .cv-note { font-family: var(--sans); font-size: 0.72rem; color: var(--muted); }
  .cv-flag {
    font-family: var(--sans); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase;

  /* ---------- Read Aloud (TTS) ---------- */
  .scripture .reading { background: #F5E6E6; box-shadow: 0 0 0 2px #F5E6E6; border-radius: 2px; }
  .read-btn {
    font-family: var(--sans); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em;

  .read-btn:hover { background: var(--hover); }

  .read-btn.tts-on .rb-ico { color: var(--paper); }
  .read-btn:active { background: var(--hover); color: var(--rubric); }
  .read-btn.tts-on { background: var(--rubric); border-color: var(--rubric); color: var(--paper); }
  .ex-speak {

  .voice-row {

  @keyframes exspin { to { transform: rotate(360deg); } }

<body>

<header>
  <h1>The Holy <span>Bible</span></h1>
  <div class="header-right">
    <div class="trans-wrap">
      <label for="translation">Translation</label>
      <select id="translation"></select>
    </div>
    <div class="settings-wrap">
      <button class="gear-btn" id="settingsBtn" title="Settings" aria-haspopup="true">&#9881;</button>
      <div class="settings-menu" id="settingsMenu" hidden>
        <div class="settings-menu-head">Settings</div>
        <button class="settings-item" id="voiceBtn">&#127908;&nbsp; Reading voice</button>
        <button class="settings-item" id="keyBtn">&#128273;&nbsp; API key</button>
      </div>
    </div>
  </div>
</header>

<!-- Page 1: books -->
<div class="view show" id="booksView">
  <button class="daily-btn" id="askBtn">&#10087; Ask a Bible Question</button>
  <div class="testament-label">Old Testament</div>
  <div class="book-grid" id="otGrid"></div>
  <div class="testament-label">New Testament</div>
  <div class="book-grid" id="ntGrid"></div>
</div>

<!-- Ask a Bible Question view -->
<div class="view" id="askView">
  <div class="read-top">
    <button class="back-btn" id="askBackBtn">&larr; Books</button>
    <div class="bookname">Ask a Bible Question</div>
  </div>
  <div id="askReader"></div>
</div>

<!-- Page 2: chapters + reading -->
<div class="view" id="readView">
  <div class="read-top">
    <button class="back-btn" id="backBtn">&larr; Books</button>
    <div class="bookname" id="bookName"></div>
    <div class="read-tools">
      <button class="back-btn" id="sizeDown" title="Smaller text">A&minus;</button>
      <button class="back-btn" id="sizeUp" title="Larger text">A+</button>
    </div>
  </div>
  <div class="chapter-strip" id="chapterStrip"></div>
  <div id="reader"></div>
  <div class="sel-bar" id="selBar" hidden>
    <span class="sel-ref" id="selRef"></span>
    <button class="lens-btn" id="exegesisBtn"><span class="lens-ltr">E</span><span class="lens-cap">Exegesis</span></button>
    <button class="lens-btn" id="reflectBtn"><span class="lens-ltr">D</span><span class="lens-cap">Devotional</span></button>
    <button class="lens-btn" id="verseAskBtn"><span class="lens-ltr">A</span><span class="lens-cap">Ask</span></button>
    <button class="lens-btn" id="councilBtn"><span class="lens-ltr">C</span><span class="lens-cap">Council</span></button>
    <button class="lens-btn" id="youthBtn"><span class="lens-ltr">Y</span><span class="lens-cap">Youth</span></button>
    <button class="lens-btn lens-close" id="selClearBtn" title="Clear selection">&#10005;</button>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* =========================================================
   SOURCES
   Source A — bible-api.com   (public domain, no key)
   Source B — API.Bible       (American Bible Society, keyed)
   ========================================================= */
const API_BIBLE = {
  endpoint: "https://rest.api.bible",
  key: "vKdfe3VftRWZ-djccZlMz"
};

// Leave empty to list every English Bible your key can access.
// To trim the dropdown, put chosen Bible IDs here, e.g.:
//   const FEATURED_API_BIBLES = ["de4e12af7f28f599-02", "01b29f4b342acc35-01"];
const FEATURED_API_BIBLES = [];

const FREE_TRANSLATIONS = [
  ["kjv",   "KJV — King James"],
  ["asv",   "ASV — American Standard"],
  ["web",   "WEB — World English"],
  ["webbe", "WEBBE — World English (British)"],
  ["darby", "Darby"],
  ["ylt",   "YLT — Young's Literal (NT only)"],
  ["dra",   "DRA — Douay-Rheims"]
];
const NT_ONLY = new Set(["free:ylt"]);

/* ---------- Canon ---------- */
const OT = [
  ["GEN","Genesis",50],["EXO","Exodus",40],["LEV","Leviticus",27],["NUM","Numbers",36],
  ["DEU","Deuteronomy",34],["JOS","Joshua",24],["JDG","Judges",21],["RUT","Ruth",4],
  ["1SA","1 Samuel",31],["2SA","2 Samuel",24],["1KI","1 Kings",22],["2KI","2 Kings",25],
  ["1CH","1 Chronicles",29],["2CH","2 Chronicles",36],["EZR","Ezra",10],["NEH","Nehemiah",13],
  ["EST","Esther",10],["JOB","Job",42],["PSA","Psalms",150],["PRO","Proverbs",31],
  ["ECC","Ecclesiastes",12],["SNG","Song of Solomon",8],["ISA","Isaiah",66],["JER","Jeremiah",52],
  ["LAM","Lamentations",5],["EZK","Ezekiel",48],["DAN","Daniel",12],["HOS","Hosea",14],
  ["JOL","Joel",3],["AMO","Amos",9],["OBA","Obadiah",1],["JON","Jonah",4],
  ["MIC","Micah",7],["NAM","Nahum",3],["HAB","Habakkuk",3],["ZEP","Zephaniah",3],
  ["HAG","Haggai",2],["ZEC","Zechariah",14],["MAL","Malachi",4]
];
const NT = [
  ["MAT","Matthew",28],["MRK","Mark",16],["LUK","Luke",24],["JHN","John",21],
  ["ACT","Acts",28],["ROM","Romans",16],["1CO","1 Corinthians",16],["2CO","2 Corinthians",13],
  ["GAL","Galatians",6],["EPH","Ephesians",6],["PHP","Philippians",4],["COL","Colossians",4],
  ["1TH","1 Thessalonians",5],["2TH","2 Thessalonians",3],["1TI","1 Timothy",6],["2TI","2 Timothy",4],
  ["TIT","Titus",3],["PHM","Philemon",1],["HEB","Hebrews",13],["JAS","James",5],
  ["1PE","1 Peter",5],["2PE","2 Peter",3],["1JN","1 John",5],["2JN","2 John",1],
  ["3JN","3 John",1],["JUD","Jude",1],["REV","Revelation",22]
];
const ALL = [...OT, ...NT];

const state = { translation: "free:kjv", book: null, chapter: null };
const $ = id => document.getElementById(id);
const transSelect = $("translation");

/* ---------- Translation dropdown ---------- */
function populateFreeTranslations() {
  const group = document.createElement("optgroup");
  group.label = "Public domain";
  for (const [id, label] of FREE_TRANSLATIONS) {
    const o = document.createElement("option");
    o.value = "free:" + id;
    o.textContent = label;
    group.appendChild(o);
  }
  transSelect.appendChild(group);
  transSelect.value = "free:kjv";
}

async function populateApiBibles() {
  try {
    const res = await fetch(`${API_BIBLE.endpoint}/v1/bibles?language=eng`, {
      headers: { "api-key": API_BIBLE.key }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { data } = await res.json();
    let bibles = data || [];
    if (FEATURED_API_BIBLES.length) {
      bibles = bibles.filter(b => FEATURED_API_BIBLES.includes(b.id));
    }
    bibles.sort((a, b) => (a.abbreviationLocal || a.abbreviation || "").localeCompare(b.abbreviationLocal || b.abbreviation || ""));
    if (!bibles.length) return;
    const group = document.createElement("optgroup");
    group.label = "API.Bible";
    for (const b of bibles) {
      const o = document.createElement("option");
      o.value = "ab:" + b.id;
      o.textContent = `${b.abbreviationLocal || b.abbreviation} — ${b.name}`;
      group.appendChild(o);
    }
    transSelect.appendChild(group);
  } catch (err) {
    console.warn("API.Bible catalog unavailable:", err.message);
  }
}

/* ---------- FUMS (required by API.Bible license) ---------- */
let fumsLoaded = false;
function reportFums(token) {
  if (!token) return;
  const fire = () => { try { window._BAPI && window._BAPI.t(token); } catch (e) {} };
  if (fumsLoaded) { fire(); return; }
  const s = document.createElement("script");
  s.src = "https://cdn.scripture.api.bible/fums/fumsv3.min.js";
  s.onload = () => { fumsLoaded = true; fire(); };
  document.head.appendChild(s);
}

/* ---------- Views & navigation ---------- */
function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("show", v.id === id));
  window.scrollTo(0, 0);
}

function buildGrid(el, books) {
  el.innerHTML = "";
  for (const [code, name] of books) {
    const b = document.createElement("button");
    b.textContent = code;
    b.title = name;
    b.dataset.code = code;
    b.addEventListener("click", () => openBook(code));
    el.appendChild(b);
  }
}
buildGrid($("otGrid"), OT);
buildGrid($("ntGrid"), NT);

function refreshGridState() {
  const otDisabled = NT_ONLY.has(state.translation);
  document.querySelectorAll("#otGrid button").forEach(b => b.disabled = otDisabled);
}

function openBook(code) {
  state.book = code;
  state.chapter = null;
  const [, name, chapters] = ALL.find(b => b[0] === code);
  $("bookName").textContent = name;
  const strip = $("chapterStrip");
  strip.innerHTML = "";
  for (let c = 1; c <= chapters; c++) {
    const b = document.createElement("button");
    b.textContent = c;
    b.addEventListener("click", () => loadChapter(code, c));
    strip.appendChild(b);
  }
  $("reader").innerHTML = `<p class="welcome">Select a chapter of ${name}.</p>`;
  selectedVerses.clear();
  currentChapter = null;
  updateSelBar();
  showView("readView");
}

/* ---------- Chapter loading (two sources) ---------- */
async function loadChapter(code, chapter, keepReading) {
  if (!keepReading) ttsStop();
  const [, name, chapterCount] = ALL.find(b => b[0] === code);
  state.book = code;
  state.chapter = chapter;
  document.querySelectorAll("#chapterStrip button").forEach(b =>
    b.classList.toggle("active", Number(b.textContent) === chapter));
  const reader = $("reader");
  reader.innerHTML = `<p class="status">Loading ${name} ${chapter}&hellip;</p>`;

  const transName = transSelect.options[transSelect.selectedIndex]?.text || "";
  const head = `
    <div class="passage-head">
      <span class="chapnum">${chapter}</span>
      <div class="passage-title">
        <div class="bookref">${name} ${chapter}</div>
        <div class="transname">${transName}</div>
      </div>
    </div>
    <div class="chapter-controls">
      <button class="back-btn summary-btn" id="summaryBtn" title="Chapter context and themes">&#10087; Chapter Summary</button>
      <button class="read-btn" id="readChapterBtn" title="Read this chapter aloud"><span class="rb-ico">&#9654;</span> Read chapter</button>
      <button class="read-btn" id="readContinuousBtn" title="Read continuously, chapter after chapter"><span class="rb-ico">&#9654;&#9654;</span> Read continuously</button>
      <button class="read-btn" id="copyChapterBtn" title="Copy this chapter">&#x29C9; Copy</button>
    </div>`;
  const pager = `
    <div class="pager">
      <button id="prevCh" ${chapter <= 1 ? "hidden" : ""}>&larr; ${name} ${chapter - 1}</button>
      <button id="nextCh" ${chapter >= chapterCount ? "hidden" : ""}>${name} ${chapter + 1} &rarr;</button>
    </div>`;

  try {
    let bodyHtml, fumsToken = null, plainText = "";
    const [source, id] = splitSel(state.translation);

    if (source === "free") {
      const res = await fetch(`https://bible-api.com/data/${id}/${code}/${chapter}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const verses = data.verses || [];
      if (!verses.length) throw new Error("No verses returned");
      bodyHtml = "<p>" + verses.map(v =>
        `<span class="verse" data-v="${v.verse}"><sup>${v.verse}</sup>${escapeHtml(v.text.trim())}</span>`).join(" ") + "</p>";
      plainText = verses.map(v => `${v.verse} ${v.text.trim().replace(/\s+/g, " ")}`).join("\n");
      chapterVerses = verses.map(v => ({ n: Number(v.verse), text: v.text.trim().replace(/\s+/g, " ") }));
    } else {
      const url = `${API_BIBLE.endpoint}/v1/bibles/${id}/chapters/${code}.${chapter}` +
        `?content-type=html&include-titles=true&include-chapter-numbers=false&include-verse-numbers=true`;
      const res = await fetch(url, { headers: { "api-key": API_BIBLE.key } });
      if (res.status === 404) throw new Error("This Bible doesn't include this chapter");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      bodyHtml = json.data && json.data.content ? json.data.content : "";
      if (!bodyHtml) throw new Error("No content returned");
      fumsToken = (json.meta && (json.meta.fumsToken || json.meta.fumsId)) || null;
      const tmp = document.createElement("div");
      tmp.innerHTML = bodyHtml;
      plainText = tmp.textContent.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
      chapterVerses = null; // verse selection is available on public domain translations for now
    }

    currentChapter = { ref: `${name} ${chapter}`, book: name, chapter, trans: transName, text: plainText };
    selectedVerses.clear();
    updateSelBar();

    reader.innerHTML = head + `<div class="scripture">${bodyHtml}</div>` + pager;
    if (chapter > 1) $("prevCh").addEventListener("click", () => loadChapter(code, chapter - 1));
    if (chapter < chapterCount) $("nextCh").addEventListener("click", () => loadChapter(code, chapter + 1));
    $("summaryBtn").addEventListener("click", runChapterSummary);
    const readCh = $("readChapterBtn");
    if (readCh && TTS.supported) {
      readCh.addEventListener("click", () => {
        const spans = Array.from(document.querySelectorAll("#reader .scripture .verse"));
        const chunks = chapterVerses ? chapterVerses.map(v => v.text)
          : spans.map(s => s.textContent.replace(/^\d+\s*/, ""));
        const els = spans.length ? spans : null;
        ttsToggle(readCh, chunks, els);
      });
    } else if (readCh) {
      readCh.style.display = "none";
    }
    const readCont = $("readContinuousBtn");
    if (readCont && TTS.supported) {
      readCont.addEventListener("click", startContinuous);
    } else if (readCont) {
      readCont.style.display = "none";
    }
    const copyCh = $("copyChapterBtn");
    if (copyCh) copyCh.addEventListener("click", copyChapter);
    reportFums(fumsToken);
  } catch (err) {
    reader.innerHTML = `<p class="status error">Couldn't load ${name} ${chapter} (${err.message}).
      Check your connection and try again, or switch translations above.</p>`;
  }
}

function splitSel(v) {
  const i = v.indexOf(":");
  return [v.slice(0, i), v.slice(i + 1)];
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- Continuous reading (auto-advance) + wake lock ---------- */
let continuousMode = false;
let wakeLock = null;
let sleepTimer = null;
let stopAfterChapter = false;

async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { /* wake lock unavailable; reading still works while screen is on */ }
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
// Re-acquire wake lock if the page returns to foreground during continuous reading
document.addEventListener("visibilitychange", () => {
  if (continuousMode && document.visibilityState === "visible") acquireWakeLock();
});

function nextChapterOf(code, chapter) {
  const idx = ALL.findIndex(b => b[0] === code);
  if (idx < 0) return null;
  const [, , count] = ALL[idx];
  if (chapter < count) return { code, chapter: chapter + 1 };
  if (idx + 1 < ALL.length) return { code: ALL[idx + 1][0], chapter: 1 };
  return null; // end of Revelation
}
function prevChapterOf(code, chapter) {
  const idx = ALL.findIndex(b => b[0] === code);
  if (idx < 0) return null;
  if (chapter > 1) return { code, chapter: chapter - 1 };
  if (idx - 1 >= 0) { const p = ALL[idx - 1]; return { code: p[0], chapter: p[2] }; }
  return null; // before Genesis 1
}

/* ---------- Text-to-Speech (Read Aloud) ---------- */
const TTS_RATE = 0.85;  // reading speed; 1.0 is normal, lower is slower
const TTS = {
  voices: [],
  supported: ("speechSynthesis" in window),
  current: null,      // the utterance-owning control element id, for toggling
};

function ttsLoadVoices() {
  if (!TTS.supported) return;
  let vs = speechSynthesis.getVoices();
  let eng = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  TTS.voices = eng.length ? eng : vs;
}
if (TTS.supported) {
  ttsLoadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = ttsLoadVoices;
}

function ttsSavedVoiceName() {
  try { return localStorage.getItem("bible.voice") || ""; } catch (e) { return ""; }
}
function ttsSaveVoiceName(n) {
  try { localStorage.setItem("bible.voice", n); } catch (e) {}
}
function ttsPickVoice() {
  const saved = ttsSavedVoiceName();
  if (saved) {
    const v = TTS.voices.find(v => v.name === saved);
    if (v) return v;
  }
  // default to a British voice if present, else first
  const brit = TTS.voices.find(v => (v.lang || "").toLowerCase().includes("gb"));
  return brit || TTS.voices[0] || null;
}

function ttsRegionLabel(v) {
  const l = (v.lang || "").toLowerCase();
  if (l.includes("gb")) return " \u2014 British";
  if (l.includes("us")) return " \u2014 American";
  if (l.includes("au")) return " \u2014 Australian";
  if (l.includes("ie")) return " \u2014 Irish";
  if (l.includes("za")) return " \u2014 S. African";
  if (l.includes("in")) return " \u2014 Indian";
  return "";
}

/* Speak an array of text chunks in sequence, invoking onChunk(index) as each starts.
   Returns a controller with stop(). */
function ttsSpeak(chunks, onChunk, onDone) {
  speechSynthesis.cancel();
  const voice = ttsPickVoice();
  let i = 0, stopped = false;
  function next() {
    if (stopped || i >= chunks.length) { if (onChunk) onChunk(-1); if (onDone && !stopped) onDone(); return; }
    if (onChunk) onChunk(i);
    const u = new SpeechSynthesisUtterance(chunks[i]);
    if (voice) u.voice = voice;
    u.rate = TTS_RATE;
    u.onend = () => { i++; next(); };
    u.onerror = () => { i++; next(); };
    speechSynthesis.speak(u);
  }
  next();
  return { stop: () => { stopped = true; speechSynthesis.cancel(); if (onChunk) onChunk(-1); } };
}

let ttsController = null;
function ttsStop() {
  if (ttsController) { ttsController.stop(); ttsController = null; }
  document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading"));
  document.querySelectorAll(".tts-on").forEach(e => e.classList.remove("tts-on"));
}

/* Toggle reading for a labeled button: if this control is playing, stop; else start. */
function ttsToggle(btnEl, chunks, highlightEls) {
  if (btnEl.classList.contains("tts-on")) { ttsStop(); return; }
  if (continuousMode) stopContinuous();
  ttsStop();
  btnEl.classList.add("tts-on");
  ttsController = ttsSpeak(
    chunks,
    (idx) => {
      document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading"));
      if (idx >= 0 && highlightEls && highlightEls[idx]) {
        highlightEls[idx].classList.add("reading");
        highlightEls[idx].scrollIntoView({ block: "center", behavior: "smooth" });
      }
    },
    () => { btnEl.classList.remove("tts-on"); ttsController = null; }
  );
}

/* Build a voice-picker option list into a <select> */
function ttsFillVoiceSelect(sel) {
  sel.innerHTML = "";
  TTS.voices.forEach((v) => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + ttsRegionLabel(v);
    sel.appendChild(o);
  });
  const chosen = ttsPickVoice();
  if (chosen) sel.value = chosen.name;
}

/* ---------- Continuous reading engine + listening mode ---------- */
function chapterChunksForReading() {
  const spans = Array.from(document.querySelectorAll("#reader .scripture .verse"));
  const chunks = chapterVerses ? chapterVerses.map(v => v.text)
    : spans.map(s => s.textContent.replace(/^\d+\s*/, ""));
  return { chunks, spans };
}

function startContinuous() {
  if (!TTS.supported || !currentChapter) return;
  continuousMode = true;
  stopAfterChapter = false;
  acquireWakeLock();
  buildListenBar();
  readCurrentThenAdvance();
}

function readCurrentThenAdvance() {
  const { chunks, spans } = chapterChunksForReading();
  updateListenBar();
  ttsController = ttsSpeak(
    chunks,
    (idx) => {
      document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading"));
      if (idx >= 0 && spans[idx]) { spans[idx].classList.add("reading"); spans[idx].scrollIntoView({ block: "center", behavior: "smooth" }); }
    },
    () => {
      // chapter finished
      if (!continuousMode) return;
      if (stopAfterChapter) { stopContinuous(); return; }
      const nxt = nextChapterOf(state.book, state.chapter);
      if (!nxt) { stopContinuous(); return; }   // reached end of Revelation
      loadChapterThenContinue(nxt.code, nxt.chapter);
    }
  );
}

async function loadChapterThenContinue(code, chapter) {
  const wasContinuous = continuousMode;
  const [, name] = ALL.find(b => b[0] === code);
  const expectedRef = `${name} ${chapter}`;
  await loadChapter(code, chapter, true);       // suppress the ttsStop reset
  // Only continue if the intended chapter actually loaded (guards against network errors looping)
  const arrived = currentChapter && currentChapter.ref === expectedRef;
  if (wasContinuous && arrived) { continuousMode = true; readCurrentThenAdvance(); }
  else if (wasContinuous && !arrived) { stopContinuous(); }
}

function pauseContinuous() {
  speechSynthesis.cancel();
  if (ttsController) { ttsController.stop(); ttsController = null; }
  updateListenBar();
}
function resumeContinuous() {
  if (!continuousMode) return;
  readCurrentThenAdvance();
}
function stopContinuous() {
  continuousMode = false;
  stopAfterChapter = false;
  if (ttsController) { ttsController.stop(); ttsController = null; }
  speechSynthesis.cancel();
  releaseWakeLock();
  clearSleepTimer();
  document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading"));
  const bar = document.getElementById("listenBar");
  if (bar) bar.remove();
}

function skipChapter(dir) {
  const move = dir > 0 ? nextChapterOf(state.book, state.chapter) : prevChapterOf(state.book, state.chapter);
  if (!move) return;
  if (ttsController) { ttsController.stop(); ttsController = null; }
  speechSynthesis.cancel();
  loadChapterThenContinue(move.code, move.chapter);
}

/* Sleep timer */
function clearSleepTimer() {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
}
function setSleepTimer(minutes) {
  clearSleepTimer();
  sleepTimer = setTimeout(() => { stopContinuous(); }, minutes * 60 * 1000);
  updateListenBar();
}

/* Listening-mode control bar */
function buildListenBar() {
  let bar = document.getElementById("listenBar");
  if (bar) bar.remove();
  bar = document.createElement("div");
  bar.id = "listenBar";
  bar.className = "listen-bar";
  bar.innerHTML = `

    </div>
    <div class="listen-opts">
      <button class="listen-opt" id="listenStopAfter">Stop after this chapter</button>
      <button class="listen-opt" id="listenSleep">Sleep in 20 min</button>
      <button class="listen-opt listen-end" id="listenEnd">End</button>
    </div>`;
  document.body.appendChild(bar);
  $("listenPrev").addEventListener("click", () => skipChapter(-1));

  $("listenPlay").addEventListener("click", () => {

    else { resumeContinuous(); }
  });
  $("listenStopAfter").addEventListener("click", () => {
    stopAfterChapter = !stopAfterChapter;
    updateListenBar();
  });
  $("listenSleep").addEventListener("click", () => {

  $("listenEnd").addEventListener("click", stopContinuous);
  updateListenBar();
}

function updateListenBar() {
  const bar = document.getElementById("listenBar");
  if (!bar) return;
  const status = $("listenStatus");
  if (status && currentChapter) {
    status.innerHTML = `<span class="ls-now">Now reading${wakeLock ? " \u00B7 screen staying awake" : ""}</span><span class="ls-ref">${currentChapter.ref}</span>`;
  }
  const play = $("listenPlay");
  if (play) play.innerHTML = ttsController ? "\u23F8" : "\u25B6";
  const sa = $("listenStopAfter");
  if (sa) sa.classList.toggle("on", stopAfterChapter);
  const sl = $("listenSleep");
  if (sl) { sl.classList.toggle("on", !!sleepTimer); sl.textContent = sleepTimer ? "Sleep timer on" : "Sleep in 20 min"; }
}

/* ---------- Minimal markdown rendering for the exegesis text ---------- */
function renderMd(src) {
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const lines = escapeHtml(src).split("\n");
  let html = "", para = [], list = null;
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
  const closeList = () => { if (list) { html += list === "ul" ? "</ul>" : "</ol>"; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    const h = line.match(/^(#{1,4})\s+(.*)/);
    const ul = line.match(/^[-*]\s+(.*)/);
    const ol = line.match(/^\d+[.)]\s+(.*)/);
    if (h) { flushPara(); closeList(); html += `<${h[1].length <= 2 ? "h3" : "h4"}>${inline(h[2])}</${h[1].length <= 2 ? "h3" : "h4"}>`; }
    else if (ul) { flushPara(); if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(ul[1])}</li>`; }
    else if (ol) { flushPara(); if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(ol[1])}</li>`; }
    else if (line.trim() === "") { flushPara(); closeList(); }
    else para.push(line);
  }
  flushPara(); closeList();
  return html;
}

const EXEGESIS_MODEL = "claude-sonnet-4-6";

function mountExegesisPanel(title, withHeaderCopy, target) {

/* Copy study text with attribution, e.g. "— Word Study · Exegesis — Genesis 1:1 (KJV)" */
function copyStudyText(text, sectionName, meta) {
  if (!text || !text.trim()) return;
  const clean = text.replace(/^##\s+/gm, "").replace(/\*\*/g, "").trim();
  const attribution = `\n\n\u2014 ${sectionName ? sectionName + " \u00B7 " : ""}${meta.title}${meta.trans ? " (" + meta.trans + ")" : ""}`;
  const payload = clean + attribution;
  const label = sectionName || meta.label || "Study";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload)
      .then(() => showToast(`${label} copied`))
      .catch(() => window.prompt("Copy this text:", payload));
  } else {
    window.prompt("Copy this text:", payload);
  }
}

/* Structured render: text before the first "## " stays visible (the distilled lead);
   each "## " section becomes a collapsible block with its own copy button.
   Open/closed choices survive re-renders. */
function renderStructured(src, openState, sectionsOut) {
  const lines = src.split("\n");
  let lead = [], sections = [], cur = null;
  for (const line of lines) {
    const m = line.match(/^##\s+(.*)/);
    if (m) { cur = { title: m[1].replace(/[*#]/g, "").split("\u2014")[0].trim(), body: [] }; sections.push(cur); }
    else if (cur) cur.body.push(line);
    else lead.push(line);
  }
  let html = `<div class="ex-lead">${renderMd(lead.join("\n"))}</div>`;
  for (const s of sections) {
    const bodyText = s.body.join("\n");
    if (sectionsOut) sectionsOut[s.title] = bodyText;
    const open = openState[s.title] ? " open" : "";
    html += `<details data-sec="${escapeHtml(s.title)}"${open}><summary><span class="sec-title">${escapeHtml(s.title)}</span>` +
      `<button class="sec-copy" data-sec="${escapeHtml(s.title)}">&#x29C9; Copy</button></summary>${renderMd(bodyText)}</details>`;
  }
  return html;
}

async function streamLens({ title, prompt, structured, target, metaOverride }) {
  const key = ensureApiKey();
  if (!key) return;
  const panel = mountExegesisPanel(title, !structured, target);
  const body = panel.querySelector(".ex-body");
  const meta = metaOverride || {
    title,
    label: title.split("\u2014")[0].trim(),
    trans: currentChapter ? currentChapter.trans.split("\u2014")[0].trim() : ""
  };
  const ctx = { full: "", sections: {} };
  const headCopy = panel.querySelector(".head-copy");
  if (headCopy) headCopy.addEventListener("click", () => copyStudyText(ctx.full, null, meta));
  body.addEventListener("click", (e) => {
    const b = e.target.closest(".sec-copy");
    if (b) {
      e.preventDefault();
      e.stopPropagation();
      copyStudyText(ctx.sections[b.dataset.sec] || "", b.dataset.sec, meta);
    }
  });
  const openState = {};
  if (structured) {
    body.addEventListener("toggle", (e) => {
      const d = e.target;
      if (d && d.dataset && d.dataset.sec) openState[d.dataset.sec] = d.open;
    }, true);
  }
  panel.scrollIntoView({ block: "nearest", behavior: "smooth" });

  // Waiting state: spinner + a status line that advances if the wait runs long
  const waitMsgs = ["Preparing\u2026", "Reading the passage\u2026", "Gathering the words\u2026"];
  let waitStep = 0;
  body.innerHTML = `<div class="ex-wait"><div class="ex-spinner"></div><span class="ex-wait-text">${waitMsgs[0]}</span></div>`;
  const waitTimer = setInterval(() => {
    waitStep++;
    const el = body.querySelector(".ex-wait-text");
    if (el && waitStep < waitMsgs.length) el.textContent = waitMsgs[waitStep];
  }, 2500);
  let streamStarted = false;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: EXEGESIS_MODEL,
        max_tokens: 3000,
        stream: true,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) {
      clearInterval(waitTimer);
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); msg = (j.error && j.error.message) || msg; } catch (e) {}
      if (res.status === 401 || res.status === 403) {
        saveApiKey("");
        msg += " \u2014 the stored key was cleared; tap \uD83D\uDD11 to enter it again.";
      }
      body.innerHTML = `<p class="ex-status">Couldn't run this: ${escapeHtml(msg)}</p>`;
      return;
    }

    const sr = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", fullText = "";
    while (true) {
      const { done, value } = await sr.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n");
      buffer = parts.pop();
      for (const line of parts) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        try {
          const ev = JSON.parse(payload);
          if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
            if (!streamStarted) {
              streamStarted = true;
              clearInterval(waitTimer);
              const hs = panel.querySelector("#exHeadSpinner");
              if (hs) hs.hidden = false;
            }
            fullText += ev.delta.text;
            ctx.full = fullText;
            if (structured) {
              ctx.sections = {};
              body.innerHTML = renderStructured(fullText, openState, ctx.sections);
            } else {
              body.innerHTML = renderMd(fullText);
            }
          }
        } catch (e) { /* partial JSON across chunks is expected; skip */ }
      }
    }
    if (!fullText) body.innerHTML = `<p class="ex-status">No text was returned \u2014 try again.</p>`;
    const hs = panel.querySelector("#exHeadSpinner");
    if (hs) hs.hidden = true;
    // Read Aloud for the finished answer
    const spk = panel.querySelector("#exSpeak");
    if (spk && fullText && TTS.supported) {
      spk.hidden = false;
      spk.addEventListener("click", () => {
        if (spk.classList.contains("tts-on")) { ttsStop(); return; }
        ttsStop();
        spk.classList.add("tts-on");
        const readable = fullText.replace(/[#*]/g, "");
        const chunks = readable.split(/\n\s*\n/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
        ttsController = ttsSpeak(chunks, null, () => { spk.classList.remove("tts-on"); ttsController = null; });
      });
    }
    // Back to Top for long answers
    if (fullText && fullText.length > 900 && !panel.querySelector(".ex-totop")) {
      const bt = document.createElement("div");
      bt.className = "ex-totop-row";
      bt.innerHTML = `<button class="ex-totop">\u2191 Back to Top</button>`;
      body.appendChild(bt);
      bt.querySelector(".ex-totop").addEventListener("click", () => {
        panel.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }
  } catch (err) {
    clearInterval(waitTimer);
    const hs = panel.querySelector("#exHeadSpinner");
    if (hs) hs.hidden = true;
    body.innerHTML = `<p class="ex-status">Couldn't reach the Anthropic API (${escapeHtml(err.message)}). Check your connection and try again.</p>`;
  }
}

/* ---------- The three lenses ---------- */
function selectedPassage() {
  const [a, b] = selRange();
  return {
    ref: `${currentChapter.ref}:${a === b ? a : a + "\u2013" + b}`,
    text: chapterVerses.filter(v => v.n >= a && v.n <= b).map(v => `${v.n} ${v.text}`).join("\n")
  };
}

function buildExegesisPrompt() {
  const { ref, text } = selectedPassage();
  const [a, b] = selRange();
  const wordScope = (b - a + 1) <= 2
    ? `Every distinct Hebrew or Greek word in the passage, as a Strong's Concordance tags them \u2014 including particles and untranslated words (e.g., the object marker \u05D0\u05B5\u05EA, H853) \u2014 in the order they appear`
    : `The 5\u20138 most significant words in the original Hebrew or Greek`;
  return `Please provide a careful exegesis of ${ref} (${currentChapter.trans}).

The passage:
${text}

Begin with exactly these two lines, nothing before them:
**Key Takeaway:** <one sentence \u2014 the heart of the passage>
**Word of Wisdom:** <one short, proverb-like line worth carrying through the week>

Then walk through these sections, each beginning with a "## " header line, each roughly 100\u2013170 words:
## Context
Where this passage sits in the structure of ${currentChapter.book} and its historical setting.
## Word Study
Open this section with the passage as a whole, interlinear-style, one labeled line each (per verse if more than one verse is selected):
**Hebrew:** (or **Greek:**) <the full original text of the passage in its own script>
**Transliteration:** <the full transliteration>
**${currentChapter.trans.split("\u2014")[0].trim()}:** <the passage as given above>
Then the word entries. ${wordScope}, Strong's Concordance\u2013style: the original word in its own script, transliteration, Strong's number (omit the number rather than guess if uncertain), root meaning, notable uses elsewhere in Scripture, and what the English translation may flatten. Give each word its own short entry; brief entries are fine for minor words. This section may run longer than the others when needed to cover the words.
## Canon
How this passage connects to the wider sweep of Scripture, with cross-references.
## Theology
What this passage reveals about God, His character, and His purposes.
## Application
Honest implications for a thoughtful Christian reader today. Where the text holds tension, hold it; do not resolve it into formulas.

Audience: a theologically serious adult reader. Depth over devotional gloss.`;
}

function buildReflectionPrompt() {
  const { ref, text } = selectedPassage();
  return `Write a short pastoral reflection (about 180\u2013220 words) on ${ref} (${currentChapter.trans}).

The passage:
${text}

Voice: warm, honest, unhurried \u2014 a wise elder speaking with a fellow believer, not lecturing. Draw out what this passage asks of the reader's heart and life today. Where the text holds tension, hold it; do not resolve it into formulas. Flowing prose, no headers.

End with exactly these two lines:
**Key Takeaway:** <one sentence>
**Word of Wisdom:** <one short, proverb-like line>`;
}

const HISTORICAL_VOICES = [
  { name: "Augustine", note: "grace, sin, the restless heart" },
  { name: "Aquinas", note: "reason and faith, careful distinctions" },
  { name: "Luther", note: "grace alone, Scripture alone" },
  { name: "Calvin", note: "God's sovereignty, careful exposition" },
  { name: "Wesley", note: "grace for all, holiness of life" },
  { name: "Spurgeon", note: "warm, vivid, pastoral" },
  { name: "C.S. Lewis", note: "imagination, reason, the ordinary reader" }
];
const MODERN_VOICES_MAX = 3;

function getModernVoices() {
  try { return JSON.parse(localStorage.getItem("bible.modernVoices") || "[]"); } catch (e) { return []; }
}
function saveModernVoices(list) {
  try { localStorage.setItem("bible.modernVoices", JSON.stringify(list)); } catch (e) {}
}

$("councilBtn").addEventListener("click", () => {
  if (!currentChapter || !chapterVerses || !selRange()) return;

function mountCouncilPanel() {
  const { ref, text } = selectedPassage();
  const old = document.getElementById("exegesisPanel");
  if (old) old.remove();
  const panel = document.createElement("div");
  panel.className = "exegesis-panel";
  panel.id = "exegesisPanel";
  const modern = getModernVoices();
  const histRow = HISTORICAL_VOICES.map(v =>
    `<button class="council-item" data-voice="${escapeHtml(v.name)}"><span class="cv-name">${escapeHtml(v.name)}</span><span class="cv-note"> \u2014 ${escapeHtml(v.note)}</span></button>`).join("");
  const modernRows = modern.map((v, i) =>
    `<div class="council-item-row">
       <button class="council-item" data-voice="${escapeHtml(v.name)}"><span class="cv-name">${escapeHtml(v.name)}</span>${v.note ? `<span class="cv-note"> \u2014 ${escapeHtml(v.note)}</span>` : ""}${v.level === "Limited" ? ` <span class="cv-flag">caution</span>` : ""}</button>
       <button class="cv-del" data-i="${i}" title="Remove">\u2715</button>
     </div>`).join("");
  const slotsLeft = MODERN_VOICES_MAX - modern.length;
  const addRow = slotsLeft > 0
    ? `<button class="council-add" id="councilAddBtn">+ Add a voice <span class="cv-slots">(${slotsLeft} slot${slotsLeft === 1 ? "" : "s"} left)</span></button>`
    : `<div class="council-full">Modern tier full (${MODERN_VOICES_MAX}). Remove one to add another.</div>`;
  panel.innerHTML = `
    <div class="ex-head">
      <span>Council of Voices \u2014 ${escapeHtml(ref)}</span>
      <div class="ex-tools"><button class="ex-close" title="Close">\u2715</button></div>
    </div>
    <div class="ex-body">
      <p class="council-intro">Choose a voice \u2014 each offers an informed characterization in the spirit of that teacher, not their actual words.</p>
      <button class="council-item council-auto" data-voice="__auto__"><span class="cv-name">\u2726 Let the Council choose</span><span class="cv-note"> the voice best suited to this verse</span></button>
      <div class="council-tier">Historical Voices</div>
      <div class="council-list">${histRow}</div>
      <div class="council-tier">Modern Voices <span class="cv-count">\u2014 ${modern.length} of ${MODERN_VOICES_MAX}</span></div>
      <div class="council-list" id="councilModernList">${modernRows}${addRow}</div>
    </div>`;
  panel.querySelector(".ex-close").addEventListener("click", () => { panel.remove(); restoreSelBar(); });
  const reader = $("reader");
  const pager = reader.querySelector(".pager");
  if (pager) reader.insertBefore(panel, pager); else reader.appendChild(panel);
  hideSelBarForPanel();
  panel.scrollIntoView({ block: "nearest", behavior: "smooth" });

  panel.querySelectorAll(".council-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const voice = btn.getAttribute("data-voice");
      runCouncilReading(voice, ref, text);
    });
  });
  panel.querySelectorAll(".cv-del").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = parseInt(btn.getAttribute("data-i"), 10);
      const list = getModernVoices();
      list.splice(i, 1);
      saveModernVoices(list);
      mountCouncilPanel();
    });
  });
  const addBtn = $("councilAddBtn");
  if (addBtn) addBtn.addEventListener("click", showAddVoiceForm);
}

function runCouncilReading(voice, ref, text) {
  const modern = getModernVoices();
  let voiceName = voice, level = null, isAuto = (voice === "__auto__");
  if (!isAuto) {
    const m = modern.find(v => v.name === voice);
    if (m) level = m.level;
  }
  const cautionNote = (level === "Limited")
    ? `\n\nIMPORTANT: There is limited documented material on this teacher. If you cannot credibly characterize their specific theological approach, say so honestly at the start rather than inventing a voice.`
    : "";
  const voiceInstruction = isAuto
    ? `Choose the single theologian or teacher from the Christian tradition whose thought most illuminates this passage, name them, and give their reading.`
    : `Give the reading of ${voiceName}.`;
  const prompt = `A reader of a Bible study app has selected a passage and wishes to hear how a particular teacher of Scripture would illuminate it, as part of the "Council of Voices" \u2014 a study feature offering the wisdom of the Christian interpretive tradition.

Passage: ${ref} (${currentChapter.trans})
${text}

${voiceInstruction}

Essential rules:
- Offer an INFORMED CHARACTERIZATION in the spirit of this teacher's known theology, emphases, and characteristic concerns \u2014 NEVER fabricated direct quotations. Do not put invented words in their mouth or present fictional quotes as real. You may describe how they characteristically approached Scripture and what they would likely emphasize here.
- Ground the reading in this teacher's actual, documented theological outlook.
- If the chosen figure is not genuinely a teacher of Scripture, theologian, or preacher whose views are documented, say so honestly instead of inventing.
- Write 2\u20134 warm, substantive paragraphs in flowing prose \u2014 no headers. Let their distinctive emphases come through.
- Begin directly with the reading (you may name the figure in the first line if helpful).${cautionNote}`;
  const title = isAuto ? `Council \u2014 ${ref}` : `${voiceName} \u2014 ${ref}`;
  streamLens({
    title, prompt, structured: false,
    metaOverride: { title, label: "Council of Voices", trans: currentChapter.trans }
  });
  // Add the honesty subnote under the header once the panel mounts
  setTimeout(() => {
    const p = document.getElementById("exegesisPanel");
    if (p && !p.querySelector(".voice-subnote")) {
      const body = p.querySelector(".ex-body");
      const note = document.createElement("p");
      note.className = "voice-subnote";
      note.textContent = isAuto
        ? "An informed characterization in the spirit of the chosen teacher's theology \u2014 not their actual words."
        : `An informed characterization in the spirit of ${voiceName}'s theology \u2014 not their actual words.`;
      if (body && body.firstChild) body.insertBefore(note, body.firstChild);
    }
  }, 60);
}

function showAddVoiceForm() {
  const list = $("councilModernList");

        <button class="ask-begin" id="addVoiceAssess">Assess</button>

    </div>`;
  const input = $("addVoiceInput");

  input.addEventListener("keydown", (e) => {

async function assessVoice() {
  const input = $("addVoiceInput");
  const name = input ? input.value.trim() : "";
  if (!name) { if (input) input.focus(); return; }
  const key = ensureApiKey();
  if (!key) return;
  const result = $("addVoiceResult");
  result.innerHTML = `<div class="av-assessing"><span class="ex-spinner"></span> Assessing\u2026</div>`;

  const prompt = `You are assessing whether an AI Bible study app can credibly characterize the theological voice of a named person, for a feature that offers "an informed characterization in the spirit of a teacher's theology."

Name entered: "${name}"

Respond with ONLY a JSON object (no markdown, no backticks) in this exact shape:
{"isTeacher": true/false, "canonicalName": "properly spelled name", "level": "Strong"|"Moderate"|"Limited", "note": "a 3-6 word descriptor of their emphases", "reason": "one honest sentence explaining the grounding level"}

Rules:
- "isTeacher" is true only if this is a real Bible teacher, theologian, preacher, or Christian thinker whose theological views are documented. If they are not (e.g. a pop singer, a fictional character, a random name), set isTeacher false and briefly say why in "reason".
- "level": "Strong" if there is substantial documented theology to characterize; "Moderate" if their general tradition is known but specifics are sparse; "Limited" if there is little reliable material specific to them.
- "canonicalName": the correct, properly-spelled form of the name.
- Be honest and conservative. Do not inflate the level.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: EXEGESIS_MODEL, max_tokens: 400, messages: [{ role: "user", content: prompt }] })
    });
    if (!res.ok) { result.innerHTML = `<p class="ex-status">Assessment failed (HTTP ${res.status}). Try again.</p>`; return; }
    const data = await res.json();
    let txt = (data.content || []).map(b => b.text || "").join("").trim();
    txt = txt.replace(/^```json\s*/i, "").replace(/```$/,"").trim();
    let a;
    try { a = JSON.parse(txt); } catch (e) { result.innerHTML = `<p class="ex-status">Couldn't read the assessment. Try again.</p>`; return; }

    if (!a.isTeacher) {
      result.innerHTML = `<div class="av-box av-no"><div class="av-title">Not a teacher of Scripture</div><div class="av-reason">${escapeHtml(a.reason || "This doesn't appear to be a Bible teacher or theologian.")}</div></div>`;
      return;
    }
    const lvl = a.level || "Moderate";
    const cls = lvl === "Strong" ? "av-strong" : (lvl === "Limited" ? "av-limited" : "av-moderate");
    const icon = lvl === "Strong" ? "\u2713" : (lvl === "Limited" ? "\u26A0" : "\u25D0");
    const cautionExtra = lvl === "Limited" ? " You can still add them, but the reading will carry a caution." : "";
    result.innerHTML = `
      <div class="av-box ${cls}">
        <div class="av-title">${icon} ${escapeHtml(lvl)} grounding</div>
        <div class="av-reason">${escapeHtml(a.reason || "")}${cautionExtra}</div>
      </div>
      <div class="av-actions">
        <button class="av-cancel" id="avCancel">Cancel</button>
        <button class="av-add" id="avAdd">Add to Council</button>
      </div>`;
    $("avCancel").addEventListener("click", mountCouncilPanel);
    $("avAdd").addEventListener("click", () => {
      const list = getModernVoices();
      if (list.length >= MODERN_VOICES_MAX) { mountCouncilPanel(); return; }
      list.push({ name: a.canonicalName || name, note: a.note || "", level: lvl });
      saveModernVoices(list);
      mountCouncilPanel();
    });
  } catch (err) {
    result.innerHTML = `<p class="ex-status">Couldn't reach the API (${escapeHtml(err.message)}).</p>`;
  }
}

End with exactly this line:
**Key Takeaway:** <one sentence for this chapter>`;
  streamLens({ title: `Chapter Summary \u2014 ${currentChapter.ref}`, prompt, structured: false });
}

/* ---------- Ask a Bible Question ---------- */
const ASK_RECENT_MAX = 50;   // total questions kept in history
const ASK_RECENT_SHOWN = 5;  // shown under the box before "Show all"
let askShowAll = false;

function getRecentQuestions() {
  try { return JSON.parse(localStorage.getItem("bible.recentQuestions") || "[]"); } catch (e) { return []; }
}
function saveRecentQuestion(q) {
  let list = getRecentQuestions().filter(x => x.toLowerCase() !== q.toLowerCase());
  list.unshift(q);
  list = list.slice(0, ASK_RECENT_MAX);
  try { localStorage.setItem("bible.recentQuestions", JSON.stringify(list)); } catch (e) {}
}
function clearRecentQuestions() {
  try { localStorage.removeItem("bible.recentQuestions"); } catch (e) {}
}
function removeRecentQuestion(q) {
  const list = getRecentQuestions().filter(x => x !== q);
  try { localStorage.setItem("bible.recentQuestions", JSON.stringify(list)); } catch (e) {}
}

function currentTransName() {
  const t = transSelect.options[transSelect.selectedIndex];
  return t ? t.text.split("\u2014")[0].trim() : "KJV";
}

function renderRecent() {
  const wrap = $("askRecent");
  if (!wrap) return;
  const full = getRecentQuestions();
  if (!full.length) { wrap.innerHTML = ""; return; }
  const showing = askShowAll ? full : full.slice(0, ASK_RECENT_SHOWN);
  const hiddenCount = full.length - showing.length;
  let html = `<div class="ask-recent-head"><span>Recent</span><button class="ask-recent-clear" id="askRecentClear">Clear all</button></div>`;
  html += showing.map(q => `<div class="ask-recent-item" data-q="${escapeHtml(q)}">` +
      `<span class="ari-icon">\u21A9</span>` +
      `<span class="ari-text">${escapeHtml(q)}</span>` +
      `<button class="ask-recent-del" title="Remove">\u2715</button></div>`).join("");
  if (hiddenCount > 0) {
    html += `<button class="ask-recent-more" id="askShowAll">Show all (${full.length})</button>`;
  } else if (askShowAll && full.length > ASK_RECENT_SHOWN) {
    html += `<button class="ask-recent-more" id="askShowLess">Show less</button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll(".ask-recent-item").forEach((row, i) => {
    const q = showing[i];
    const fill = () => {
      const input = $("askInput");
      input.value = q;
      input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
      input.focus();
    };
    row.querySelector(".ari-text").addEventListener("click", fill);
    row.querySelector(".ari-icon").addEventListener("click", fill);
    row.querySelector(".ask-recent-del").addEventListener("click", (e) => {
      e.stopPropagation();
      removeRecentQuestion(q);
      renderRecent();
    });
  });
  $("askRecentClear").addEventListener("click", () => { clearRecentQuestions(); askShowAll = false; renderRecent(); });
  const more = $("askShowAll");
  if (more) more.addEventListener("click", () => { askShowAll = true; renderRecent(); });
  const less = $("askShowLess");
  if (less) less.addEventListener("click", () => { askShowAll = false; renderRecent(); });
}

let askVerseContext = null;   // {ref, text, trans} when asking about a specific verse
let askReturn = null;         // {code, chapter, label} to return to a chapter after a verse-level Ask

function showAsk(seedContext, verseCtx) {
  askVerseContext = verseCtx || null;
  const el = $("askReader");
  const ctxChip = askVerseContext
    ? `<div class="ask-context">About <strong>${escapeHtml(askVerseContext.ref)}</strong><button class="ask-context-x" id="askCtxClear" title="Ask without this verse">\u2715</button></div>`
    : "";
  el.innerHTML = `
    <div class="daily-ask" id="askCard">
      <div class="ask-head">Ask a Bible Question</div>
      <p class="ask-q">What would you like to ask?</p>
      <p class="ask-sub">Anything about Scripture \u2014 a passage, a person, a word, a theme, a difference between traditions.</p>
      ${ctxChip}
      <div class="ask-row">
        <textarea id="askInput" rows="1" placeholder=""></textarea>
        <button class="ask-begin" id="askGo">Ask</button>
      </div>
      <div class="ask-recent" id="askRecent"></div>
    </div>`;
  const input = $("askInput");
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runAsk(); }
  });
  $("askGo").addEventListener("click", runAsk);
  const ctxClear = $("askCtxClear");
  if (ctxClear) ctxClear.addEventListener("click", () => { askVerseContext = null; showAsk(); });
  renderRecent();
  updateAskBackLabel();
  showView("askView");
  if (seedContext && typeof seedContext === "string") {
    input.value = seedContext;
    setTimeout(() => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }, 0);
  }
  setTimeout(() => { input.focus(); const n = input.value.length; input.setSelectionRange(n, n); }, 50);
}

function buildAskPrompt(question, verseCtx) {
  const trans = currentTransName();
  const ctxLine = verseCtx
    ? `The reader is asking specifically about ${verseCtx.ref} (${verseCtx.trans}): "${verseCtx.text}"\n\nTheir question about it:\n"${question}"`
    : `"${question}"`;
  return `A reader of a Bible study app has asked this question:

${ctxLine}

Answer it clearly and helpfully, as a knowledgeable, trustworthy Bible teacher would. Guidelines:
- Ground the answer in Scripture; cite specific references, and quote briefly from the ${trans} translation where a quotation helps.
- Keep it focused and readable \u2014 usually a few short paragraphs. Match the depth to the question: a simple factual question gets a concise answer; a weighty one gets more care.
- On matters where sincere Christians and major traditions genuinely differ (for example baptism, predestination, end-times, church government, the age of creation), do not present one tradition's view as the settled answer. Briefly lay out what the main positions hold and the scriptural reasoning behind them, and let the reader weigh it. Where the text holds tension, hold it rather than resolving it into a formula.
- Warm, plain, respectful. No headers or section labels unless the answer genuinely needs a short list. Do not open with filler like "Great question."

Scope \u2014 important: This tool is for understanding the Bible and the Christian faith. Answer freely when a question serves that understanding \u2014 this includes Scripture itself, theology, church history, and the historical, cultural, linguistic, and archaeological background that illuminates the text (Roman and Ancient Near Eastern history, biblical languages, customs, geography, and the like). But if a question does not serve the understanding of the Bible and Christianity \u2014 a general-knowledge question, a request for help with an unrelated task, current events, and so on \u2014 do not answer it. Instead, warmly and briefly say that this tool is for questions about the Bible and the Christian faith, and invite a question of that kind. Do not answer the off-topic question even partially.`;
}

function runAsk() {
  const input = $("askInput");
  const question = input ? input.value.trim() : "";
  if (!question) { if (input) input.focus(); return; }
  const verseCtx = askVerseContext;
  // History entry is tagged with the verse when present
  const historyEntry = verseCtx ? `${verseCtx.ref} \u2014 ${question}` : question;
  saveRecentQuestion(historyEntry);
  askShowAll = false;
  const meta = { title: verseCtx ? `Ask \u2014 ${verseCtx.ref}` : "Ask a Bible Question", label: "Q&A", trans: currentTransName() };
  const card = $("askCard");
  if (card) card.remove();
  streamLens({
    title: meta.title,
    prompt: buildAskPrompt(question, verseCtx),
    structured: false,
    target: $("askReader"),
    metaOverride: meta
  });
  askVerseContext = null;
  // When the answer panel is closed, return to the question screen
  const panel = document.getElementById("exegesisPanel");
  if (panel) {
    panel.querySelector(".ex-close").addEventListener("click", () => {
      if ($("askView").classList.contains("show")) showAsk();
    });
  }
}

$("askBtn").addEventListener("click", () => { askReturn = null; showAsk(); });
$("askBackBtn").addEventListener("click", () => {
  $("askReader").innerHTML = "";
  if (askReturn) {
    const r = askReturn; askReturn = null;
    loadChapter(r.code, r.chapter);
    showView("readView");
  } else {
    showView("booksView");
  }
});
function updateAskBackLabel() {
  const b = $("askBackBtn");
  if (b) b.innerHTML = askReturn ? `&larr; ${escapeHtml(askReturn.label)}` : "&larr; Books";
}


/* Text size — steps applied to the scripture body, remembered per device */
const SIZES = [0.95, 1.05, 1.16, 1.3, 1.5, 1.75];
let sizeIdx = 2;
try {
  const s = parseInt(localStorage.getItem("bible.textSize"), 10);
  if (!isNaN(s) && s >= 0 && s < SIZES.length) sizeIdx = s;
} catch (e) {}
function applySize() {
  document.documentElement.style.setProperty("--fs", SIZES[sizeIdx] + "rem");
  $("sizeDown").disabled = sizeIdx === 0;
  $("sizeUp").disabled = sizeIdx === SIZES.length - 1;
  try { localStorage.setItem("bible.textSize", sizeIdx); } catch (e) {}
}
$("sizeDown").addEventListener("click", () => { if (sizeIdx > 0) { sizeIdx--; applySize(); } });
$("sizeUp").addEventListener("click", () => { if (sizeIdx < SIZES.length - 1) { sizeIdx++; applySize(); } });
applySize();

$("backBtn").addEventListener("click", () => {
  stopContinuous();
  ttsStop();
  state.book = null;
  state.chapter = null;
  selectedVerses.clear();
  currentChapter = null;
  updateSelBar();
  showView("booksView");
});

transSelect.addEventListener("change", () => {
  state.translation = transSelect.value;
  try { localStorage.setItem("bible.defaultTranslation", state.translation); } catch (e) {}
  refreshGridState();
  if (NT_ONLY.has(state.translation) && state.book && OT.some(b => b[0] === state.book)) {
    state.book = null; state.chapter = null;
    showView("booksView");
    return;
  }
  if (state.book && state.chapter) loadChapter(state.book, state.chapter);
});

/* ---------- Init ---------- */
// iOS Safari only honors :active styles once a touchstart listener exists
document.addEventListener("touchstart", () => {}, { passive: true });

function restoreSavedTranslation() {
  let saved = null;
  try { saved = localStorage.getItem("bible.defaultTranslation"); } catch (e) {}
  if (!saved) return;
  const exists = [...transSelect.options].some(o => o.value === saved);
  if (exists) {
    transSelect.value = saved;
    state.translation = saved;
    refreshGridState();
  }
}

populateFreeTranslations();
restoreSavedTranslation();                     // free translations restore immediately
populateApiBibles().then(restoreSavedTranslation); // API.Bible ones restore once the catalog loads
refreshGridState();
</script>
